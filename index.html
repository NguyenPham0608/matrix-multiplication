<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix multiply · cache simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="teaching">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Matrix multiply <span>cache simulator</span></h1>
        <p class="sub" id="modeBlurb"></p>
      </div>
      <div class="seg" role="group" aria-label="Cache model">
        <button id="modeTeaching" aria-pressed="true">Teaching</button>
        <button id="modeM5" aria-pressed="false">M5</button>
        <button id="modeX86" aria-pressed="false">x86</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="side">
      <section class="panel">
        <h2>Method</h2>
        <div class="methods" role="group" aria-label="Multiplication method">
          <button id="mijk" class="method" aria-pressed="true" title="Each output walks down a column of B, so every step hits a new cache line.">
            Naive <span class="chip">i-j-k</span>
          </button>
          <button id="mikj" class="method" aria-pressed="false" title="Inner loops swapped so B and C are read along rows and every loaded line is fully used.">
            Reordered <span class="chip">i-k-j</span>
          </button>
          <button id="mtile" class="method" aria-pressed="false" title="Works on small blocks so the block in use stays in cache while it is reused.">
            Tiled
          </button>
        </div>
        <div class="field tilefield">
          <label for="tile">Tile</label>
          <select id="tile"></select>
        </div>
      </section>

      <section class="panel">
        <h2>Matrices</h2>
        <div class="dimgrid">
          <span class="matlabel">A</span>
          <input type="number" id="aR" min="1" max="1024" step="1" value="16" aria-label="Rows of A">
          <span class="x">×</span>
          <input type="number" id="aC" min="1" max="1024" step="1" value="16" aria-label="Columns of A">
          <button type="button" class="lock" id="lockA" aria-pressed="false" aria-label="Keep A square" title="Keep square">
            <svg class="open" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 5.8-1"/></svg>
            <svg class="shut" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>
          </button>

          <span class="matlabel">B</span>
          <input type="number" id="bR" min="1" max="1024" step="1" value="16" aria-label="Rows of B">
          <span class="x">×</span>
          <input type="number" id="bC" min="1" max="1024" step="1" value="16" aria-label="Columns of B">
          <button type="button" class="lock" id="lockB" aria-pressed="false" aria-label="Keep B square" title="Keep square">
            <svg class="open" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 5.8-1"/></svg>
            <svg class="shut" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>
          </button>
        </div>
        <p id="dimStatus" class="status" role="status"></p>
      </section>

      <section class="panel teach-only">
        <h2>Cache</h2>
        <div class="field">
          <label for="cap">Size</label>
          <input type="range" id="cap" min="8" max="64" step="4" value="16">
          <span id="capOut" class="out">16 lines</span>
        </div>
      </section>
    </aside>

    <div class="content">
      <section class="panel stage">
        <div class="legend">
          <span class="teach-only"><span class="sw hit"></span>Hit</span>
          <span class="teach-only"><span class="sw miss"></span>Miss</span>
          <span class="teach-only"><span class="sw cached"></span>Cached</span>
          <span class="real-only"><span class="sw hit"></span>L1</span>
          <span class="real-only"><span class="sw l2"></span>L2</span>
          <span class="real-only l3-only"><span class="sw l3"></span>L3</span>
          <span class="real-only"><span class="sw miss"></span>DRAM</span>
          <span class="real-only"><span class="sw cached1"></span>In L1</span>
          <span class="real-only"><span class="sw cached2"></span>In L2</span>
        </div>

        <canvas id="cv" aria-label="Grids for matrices A, B and C showing cache hits and misses"></canvas>
        <p id="dims" class="muted"></p>

        <div class="progress" aria-hidden="true"><div id="progFill"></div></div>

        <div class="transport">
          <button id="play" class="primary" title="Space">Play</button>
          <button id="step" title="Step (→)">Step</button>
          <button id="reset" title="Reset (R)">Reset</button>
          <div class="speed">
            <label for="speed">Speed</label>
            <input type="range" id="speed" min="0" max="1000" step="1" value="391">
            <span id="speedOut" class="out">12 / frame</span>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Counters</h2>
        <div class="cards" id="cards"></div>
        <div class="sharebar" id="share" aria-hidden="true"></div>
        <p id="per" class="muted"></p>
      </section>

      <section class="panel">
        <h2 id="cmpTitle">Full run</h2>
        <div class="cmp" id="cmp"></div>
      </section>

      <details class="panel real-only" id="specs">
        <summary>Model details</summary>
        <table class="specs"><tbody id="specsBody"></tbody></table>
        <p class="muted" id="specsNote"></p>
      </details>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
